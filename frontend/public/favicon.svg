<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="pujaSaffron" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E45314" />
      <stop offset="100%" stop-color="#BF400B" />
    </linearGradient>
  </defs>

  <!-- Background container with crisp minimalist rounding -->
  <rect width="32" height="32" rx="6.5" fill="url(#pujaSaffron)" />

  <!-- Inner Dark Sacred Disc for High Contrast -->
  <circle
    cx="16"
    cy="16"
    r="11.5"
    fill="#121214"
  />
  
  <!-- Outer Sacred Circle Ring -->
  <circle
    cx="16"
    cy="16"
    r="11.5"
    stroke="#FFFFFF"
    stroke-opacity="0.3"
    stroke-width="1.2"
  />
  <circle
    cx="16"
    cy="16"
    r="11.5"
    stroke="#FFFFFF"
    stroke-width="1.2"
    stroke-linecap="round"
    stroke-dasharray="48 24"
    stroke-dashoffset="10"
  />

  <!-- Diya Base (Sacred Oil Lamp Bowl) -->
  <path
    d="M8.5 18C8.5 22 11.5 23.8 16 23.8C20.5 23.8 23.5 22 23.5 18H8.5Z"
    fill="#FFFFFF"
  />
  <!-- Diya Lip Line -->
  <path
    d="M7.5 18H24.5"
    stroke="#FFFFFF"
    stroke-width="1.2"
    stroke-linecap="round"
  />

  <!-- Sacred Agni / Diya Flame -->
  <path
    d="M16 6.5C14 9.8 12 12.5 12 14.8C12 17 13.8 18.5 16 18.5C18.2 18.5 20 17 20 14.8C20 12.5 18 9.8 16 6.5Z"
    fill="#FFFFFF"
  />

  <!-- Inner Flame Core (Golden Warmth) -->
  <path
    d="M16 10.5C15 12.5 14 14 14 15.2C14 16.3 14.8 17.2 16 17.2C17.2 17.2 18 16.3 18 15.2C18 14 17 12.5 16 10.5Z"
    fill="#FAAD07"
  />
</svg>
